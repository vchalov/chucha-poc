<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is here for one reason: it is what makes
         `env(safe-area-inset-*)` report anything but zero. Under the default
         `contain`, Safari pillarboxes the page away from the notch but leaves
         its bottom edge under the home indicator, and the page has no way to
         learn that — every inset reads 0. The adult strip sits on that edge, so
         its lower band was being swallowed by the system before Safari saw it.
         See `#session` for the measurements and what now pays the insets back. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Hosted publicly so the specialist can open it on her own devices, but
         it is a clinical prototype rather than a product: keep it out of search
         results. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- All visible text is injected from src/strings.ts (see CLAUDE.md:
         user-facing text lives in resource files, never in markup). -->
    <title></title>
    <style>
      :root {
        --ink: #1a1a2e;
        --paper: #f7f7fb;
        --accent: #4f8a5b;
        --accent-soft: #dcebe0;
        --warn: #b0623a;
        --muted: #6b6b80;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--paper);
        color: var(--ink);
      }
      [hidden] { display: none !important; }

      /* ---------------------------------------------------------------- setup */
      /* The two scrolling screens. Their side padding is `max()` against the
         safe-area insets because `viewport-fit=cover` (see the meta tag) lets
         the page run under the notch: in landscape those insets are 62 px, far
         more than the 1.25rem this screen would otherwise sit on, and a label
         that disappears under the Dynamic Island is unreadable rather than
         merely tight. On every screen without insets `max()` returns the
         original value, so nothing moves.

         Sides only. The bottom inset is at most 34 px and these screens already
         end on 3rem of it, so wrapping that in `max()` too would look like it
         was doing something and never do it. */
      #setup {
        max-width: 34rem;
        margin: 0 auto;
        padding: 1.5rem max(1.25rem, env(safe-area-inset-right)) 3rem
          max(1.25rem, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      #expired {
        max-width: 30rem;
        margin: 0 auto;
        padding: 3rem max(1.25rem, env(safe-area-inset-right)) 3rem
          max(1.25rem, env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        align-items: flex-start;
      }
      #expired h1 { margin: 0; font-size: 1.35rem; }
      #expired p { margin: 0; }

      #setup h1 { margin: 0 0 0.25rem; font-size: 1.35rem; }
      #setup .subtitle { margin: 0; color: var(--muted); font-size: 0.95rem; }
      fieldset {
        border: 1px solid #dcdce6;
        border-radius: 0.6rem;
        padding: 1rem;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
      }
      legend { padding: 0 0.4rem; font-weight: 600; font-size: 0.95rem; }
      .row { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
      .row > .grow { flex: 1; min-width: 8rem; }

      button {
        font: inherit;
        padding: 0.55rem 1.1rem;
        border-radius: 0.5rem;
        border: 1px solid var(--ink);
        background: white;
        color: var(--ink);
        cursor: pointer;
      }
      button.primary { background: var(--ink); color: white; }
      button:disabled { opacity: 0.4; cursor: default; }
      input[type='range'] { accent-color: var(--accent); }
      input[type='file'] { display: none; }

      .meters {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 0.4rem 0.7rem;
        align-items: center;
        font-size: 0.88rem;
      }
      .bar {
        height: 0.7rem;
        background: #e3e3ec;
        border-radius: 0.35rem;
        overflow: hidden;
        position: relative;
      }
      .bar > .fill {
        height: 100%;
        width: 0%;
        background: var(--accent);
        transition: width 60ms linear;
      }
      .bar.low > .fill { background: var(--warn); }
      .bar .threshold {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--ink);
        opacity: 0.55;
        transition: left 100ms ease-out;
      }
      #f0 { min-width: 5rem; text-align: right; font-variant-numeric: tabular-nums; }
      .hint { color: var(--muted); font-size: 0.85rem; margin: 0; }
      /* The probe reports one line per clip length; without this they collapse. */
      #probe-readout { white-space: pre-line; }
      /* The device readout. Monospace so the padded label column lines up, but
         `pre-wrap` rather than `pre` and wrapping allowed mid-token: the value
         this block most often has to carry is a user-agent string, and the
         alternative is a horizontally scrolling box on a phone. That would be
         the one shape this block must not take — it is read by being
         screenshotted, and a screenshot cannot capture what is scrolled out of
         view. Alignment survives for every short row and is spent only on the
         long one. */
      #diagnostics-readout {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--muted);
      }
      .status { font-size: 0.9rem; color: var(--muted); }
      .status.ok { color: var(--accent); }
      .status.error { color: var(--warn); }

      /* -------------------------------------------------------------- session */
      /* The play surface. No instructions, no idle animation, nothing that
         reacts to the child being silent — see docs/mission.md. */
      #session {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        /* KEEP THE STRIP OUT OF THE SYSTEM'S GESTURE BANDS. Reported on an
           iPhone 14 Pro Max (2026-08-16): in landscape the confirm buttons are
           fully visible but only their top part takes a press.

           The cause is not the layout — it is that iOS takes the touch first.
           A confirm button is 48 px tall and sits flush with the page's bottom
           edge, and on a notched iPhone in landscape the bottom 20 px of the
           page are the home indicator's. Presses that land there never reach
           the page at all: instrumented on the device, a `pointerdown` bound to
           this element does not fire for them, which is what rules out every
           explanation inside CSS. That leaves the top 28 px of 48 pressable —
           "only the top part", to the pixel.

           So the session pays the insets back. Bottom clears the home
           indicator; left and right clear the notch, which `viewport-fit=cover`
           has just let the page slide under (see the meta tag). Top is
           deliberately NOT paid: it reads 0 in a browser tab, and the only
           thing up there is the child's video, which needs no touch.

           Measured with `viewport-fit=cover` on iOS 26.5 (Simulator, iPhone 17,
           2026-08-16), landscape: insets 0/62/20/62 (t/r/b/l), `innerWidth` 812
           against 750 without `cover`. The child's picture pays for this in
           width — but it is letterboxed already (`object-fit: contain`), so a
           wider black margin costs nothing that a cut-off corner under the
           notch would not cost more.

           Two earlier attempts are worth not repeating, because both looked
           right and neither was. `calc(100lvh - 100svh)` as padding cost iOS
           26.5 40 px for nothing: it floated the strip above Safari's toolbar
           with a black gap under it. `height: 100svh` was harmless there but
           equally beside the point — Safari already sizes a fixed box to the
           small viewport, so it changed no measurement in either orientation.
           Neither touched the tap that goes missing, because neither cause was
           the real one. */
        padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #stage { position: relative; flex: 1; min-height: 0; }
      #stage > video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      /* The idle half of the double buffer. Kept in the layout rather than
         `display: none` so the browser goes on decoding it — that preloading
         is the entire point. It is paused, so it makes no sound. */
      #stage > video.behind { visibility: hidden; }
      /* Opaque by default: the screen gives nothing back between rewards. */
      #curtain {
        position: absolute;
        inset: 0;
        background: #000;
        pointer-events: none;
      }
      #curtain.lifted { display: none; }
      /* Adult strip. Deliberately plain and low-contrast: the adult needs it,
         the child must not read it as a cue. */
      #adult-bar {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.5rem 0.8rem;
        background: #101018;
        color: #c9c9d4;
        font-size: 0.85rem;
        /* THE HEIGHT IS THE RULE, NOT THE LINE COUNT. A bar that grows when a
           diagnostic appears or a counter fills resizes the video the child is
           watching, mid-reward — the adult's text must never move the child's
           picture. At stage 2 below 1600 px the strip *is* two rows (see the
           media query further down), and that is fine because the height is
           still pinned by CSS rather than decided by the content: items may
           move between rows, the video never moves. What stays forbidden is
           `flex-wrap` with an auto height, which is the same bar reflowing
           from one row to two the moment «0/5» becomes «авто», mid-reward. */
        height: 3.25rem;
        flex: none;
        flex-wrap: nowrap;
        white-space: nowrap;
        /* A backstop, not a feature: at the one-row widths a long enough set of
           target labels can still outrun the strip, and a «Завершить» that
           cannot be reached at all ends nothing. `scrollbar-width: none` and its
           WebKit twin stop a horizontal scrollbar claiming layout height on the
           platforms that still draw one, so this cannot violate the rule above.
           Nothing here is meant to be reached by scrolling. */
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
      #adult-bar::-webkit-scrollbar { display: none; }
      /* Row splitter, inert wherever the strip is a single row. */
      #adult-bar-break,
      #adult-bar-break-phone { display: none; }
      /* The items that must keep their size, whatever else is on the strip. */
      #adult-bar > button,
      #adult-bar #session-stage,
      #adult-bar #session-sensitivity { flex: none; }
      #adult-bar button {
        background: transparent;
        color: #c9c9d4;
        border-color: #3a3a4a;
        padding: 0.4rem 0.9rem;
      }
      #adult-bar button.primary { background: #2c4a33; border-color: #2c4a33; color: #eaf3ec; }
      /* Stage 1's single confirm, sized like stage 2's four: it is the button
         that counts a response for that whole stage, so the ~48 dp argument
         under `#target-confirms` applies to it word for word. It was left at
         31 px when the others were raised, which put the one control stage 1
         is worked through below the floor the rest of the strip now meets. */
      #adult-bar #confirm {
        align-self: stretch;
        margin-block: -0.5rem;
      }
      /* The strip and the confirm group can both scroll now, and a tap inside a
         scroll container is a tap the browser may sit on while it waits to see
         whether a pan or a double-tap-zoom is starting. A swallowed or delayed
         press is a response that goes uncounted — the one number the PoC exists
         to produce.

         `manipulation`, not the `none` that `#hold-mute` uses. Those two want
         opposite things: the mute is a *hold*, which a scroll claim would
         cancel outright, so it refuses every gesture. These are taps, and
         refusing every gesture here would also refuse the drag that scrolls
         four long labels back into view. `manipulation` delivers the tap
         immediately and leaves the pan alone. */
      #adult-bar #confirm,
      #adult-bar #stop-reward,
      #adult-bar #end-session,
      .confirm-group button {
        touch-action: manipulation;
      }
      /* Greyed rather than hidden. There is nothing to cancel between rewards,
         and a control that comes and goes would move everything on the strip
         with it — the one thing the fixed height forbids. It also says which
         state the session is in without a word of its own. */
      #adult-bar #stop-reward:disabled { opacity: 0.35; }
      /* Hold-to-mute, sized to be hit without looking: full bar height and wide
         enough for a thumb, because the gesture it replaces was rejected for
         being slow, and a target that needs aiming would be no faster.

         The three suppressions are what make a hold work under a finger rather
         than a mouse. `touch-action: none` stops the browser claiming the
         gesture as a scroll or zoom part-way through — which would fire
         pointercancel and silently unmute. The other two stop Android's
         long-press behaviours (text selection, the callout menu) appearing over
         the child's video after ~500 ms of exactly the hold this button is for. */
      #hold-mute {
        flex: none;
        align-self: stretch;
        min-width: 8rem;
        /* Negative margins cancel the bar's own padding so the target fills the
           bar's full height and runs into the screen's left edge. Inside the
           padding it came out 36 px tall, under the ~48 dp both platforms
           recommend for touch; against the edge it is both taller and
           unmissable, because a thumb can be driven into a corner without
           aiming. That is the entire requirement here — the slider it
           supplements was rejected for being slow, and a target needing aim
           would be no better. */
        margin: -0.5rem 0.3rem -0.5rem -0.8rem;
        border-radius: 0 0.35rem 0.35rem 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        white-space: nowrap;
      }
      /* Held state carries on the button itself as well as in the bar colour:
         the bar also turns for a slider mute, and the adult should be able to
         tell which of the two is holding the app silent. */
      #hold-mute.held {
        background: #6b3f2a;
        border-color: #6b3f2a;
        color: #f4e2d8;
      }
      #session-count { font-variant-numeric: tabular-nums; }
      #session-sensitivity { width: 7rem; accent-color: var(--accent); }
      #session-sensitivity-label { font-size: 0.75rem; opacity: 0.7; }
      /* "Not listening" has to be visible at a glance, because the whole point
         of putting the mute on the slider is that its state is never a thing
         the adult has to remember. */
      #session-listening { font-size: 0.75rem; color: #d79a72; white-space: nowrap; }
      #session-listening:empty { display: none; }
      #setup-listening { font-size: 0.8rem; color: var(--warn); white-space: nowrap; }
      #setup-listening:empty { display: none; }
      #adult-bar.not-listening { background: #2a1d16; }
      /* WHAT HAPPENS WHEN THE BAR RUNS OUT OF ROOM. It gets a second row — it
         does not drop «Завершить», which is how a session ends and the summary
         appears, and which sits last and so is the first thing an overflow
         pushes out of reach.

         Measured 2026-08-10, stage 2, four targets, against the widest the
         strip's content gets during a session (every counter on «авто», the
         count at three digits). One row needed ~1320 px then and needs ~1444 px
         since «Отменить» joined the strip — a control is worth 107 px here, and
         adding one is a layout change whatever else it is. The target display is
         1920×1080, where it fits with 476 px to spare and always did. At
         1024×768 it wanted 1288 px against 1024 and «Завершить» sat at x
         1150..1253 — off the edge, with `overflow: hidden` and `nowrap` leaving
         no way to scroll to it.

         The 2026-08-04 attempt at this is worth reading as a warning. It tried
         to make diagnostics yield, and recovered *nothing* at stage 2: of the
         three things it made shrinkable, `#session-stage` never obeyed the rule
         at all (`flex: none` below wins on specificity), and `#session-position`
         and `#session-listening` are both empty on a stage-2 strip — main.ts
         clears the clip position there. It was measured on a bar whose
         diagnostics happened to hold text, so it appeared to buy room that a
         real session never had. Its «~294 px for four confirm buttons» was
         wrong when written, too: git shows the labels and the counters both
         predate it unchanged, so the same four groups measured 578 px. The
         lesson is not "shrink harder" — the diagnostics are worth ~120 px
         between them and the deficit is 300 — it is that a strip carrying four
         confirm buttons and their counters does not fit one row on a tablet,
         and that a figure measured on a strip in the wrong state is worse than
         no figure. Re-measure in the state a session will actually be in.

         So: at stage 2, one row above 1600 px and two below, and nothing is
         truncated at any width. The controls keep their wording and their full
         width everywhere, which is what the earlier note was reaching for and
         could not afford — the narrow strip pays in *readouts* instead, and
         which ones it drops and where is under the media queries below. */
      #session-stage,
      #session-position,
      #session-listening {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* «Засчитано: N» is not a diagnostic. It is the count the specialist reads
         to judge whether the child responded more than usual — the PoC's exit
         condition (docs/poc-plan.md, "Definition of done"), and the one number
         the app deliberately keeps in memory instead of persisting. Truncating
         it to «Зас…» loses exactly that, so it holds its width and the clip
         falls on the stage badge and the clip position instead. */
      #hold-mute,
      #confirm,
      #stop-reward,
      #target-confirms,
      #end-session,
      #session-count,
      #session-sensitivity,
      #session-sensitivity-label {
        flex: none;
      }
      /* THE SECOND ROW, and who pays for it. A row costs the child ~50 px of
         picture, so it is spent only where something actually needs it: on
         `.stage-two`, which main.ts sets while the four-target screen is
         running, and only below 1600 px. Stage 1 carries one video and two
         buttons and has never come close to filling a row, so it keeps the
         3.25rem strip at every width — an earlier cut of this keyed the query
         on viewport alone and took 52 px off stage 1's play area at 1280 and
         60 px at 768, for a second row that held one 31 px button.

         1600 rather than the ~1444 the quiet strip measures, because the strip
         is not always quiet. Hold the mute and «не слушает» appears beside the
         count; at 1401 with four «Засчитать: мама» that alone pushed
         «Завершить» 5 px past the right edge — the very failure this file
         exists to prevent, reintroduced by a breakpoint set from a measurement
         taken with the label empty. The one-row worst case measures 1548, so
         1600 leaves room for a longer label than any measured here, and the
         `overflow-x` backstop covers whatever is longer still.

         It was 1500 against a worst case of ~1419 until «Отменить» was added
         (2026-08-16), which cost 107 px and put the worst case 48 px the wrong
         side of the old breakpoint: at 1501 with four-character labels
         «Завершить» sat 47 px off the right edge. Both numbers moved together,
         which is the thing to copy — a control added to this strip is a
         breakpoint to re-measure, not just a button.

         The rows are split deliberately rather than wherever the content
         happens to break, and the confirm buttons own the lower one outright.
         That is what the `order` values are for. It also means the lower row
         can never wrap: `#target-confirms` is the only thing on it, and it is
         `flex: 1 1 0` there, so it shrinks and scrolls inside itself instead of
         being pushed onto a third line the fixed height would clip. Sharing
         that row with the mute is what used to make it wrap — at 901 with
         labels like «свисток» the confirm buttons dropped to a third line and
         23 px of every one of them was cut off below the bar, with
         `overflow-y: hidden` and no gesture to recover it.

         So the mute sits on the upper row at every two-row width. It keeps the
         screen's left edge and its full height and loses only the corner; that
         is the one real sacrifice here, and it buys a confirm button that is
         always whole. A control that is half cut off cannot be pressed at all.

         `#adult-bar-break` is an empty full-width item that forces the split;
         flex has no break-before. Note the cost of `order`: keyboard focus
         still follows the markup, so tabbing reaches the lower row before the
         upper one. With four focusable things on the strip that is a wrinkle,
         not a trap.

         Every override below is scoped with `#adult-bar.stage-two` on purpose,
         which outranks the `> *` reset (2,1,0 against 1,1,0). They used to be
         equal-specificity selectors separated only by source order, so sorting
         the block or moving one declaration would have silently collapsed every
         item back onto one row with nothing to show for it.

         Verified 2026-08-16 at 768, 900, 901, 1000, 1001, 1024, 1280, 1600,
         1601 and 1920, both stages, labels of one to four characters, counters
         «0/5» and «авто», counts of one digit to three, and *both* mute states
         — that last one is what an earlier pass missed. Within a stage the
         height never moves as that content fills: 52 px at stage 1 everywhere,
         52 px at stage 2 above 1600 and 112 below. «Завершить» and every
         pressable control sits whole inside the bar in all of it, and the
         readouts clip on an exact line boundary rather than showing a sliver.

         Beyond the matrix: labels long enough to outrun the lower row (tested
         with «Засчитать: паровозик едет» four times at 901) scroll inside
         `#target-confirms` and stay whole and reachable — the height holds and
         nothing is cut off. That is the backstop doing its job, not a supported
         layout.

         One residual, left alone. At 768 with four-character labels the
         rightmost confirm button reaches under «Завершить», 17 px below it, so
         a press that lands high ends the session. Giving the confirms the whole
         lower row shortened this a long way — the buttons now start at the
         screen edge instead of after the mute, so «с ш р л» and «сь ль шь рь»
         clear it entirely and only word-length labels reach that far. The rest
         is the width: both rows are full, and the only other place «Завершить»
         could go is the left end of its row, directly over the mute, which is
         the mis-aim this layout least wants. */
      @media (max-width: 1600px) {
        #adult-bar.stage-two {
          flex-wrap: wrap;
          /* Two 3rem rows plus the strip's own 0.5rem padding top and bottom,
             to the pixel: 112 - 16 = 96 = 48 + 48. Fixed here and never by the
             content, which is the whole of the rule at the top of this file. */
          height: 7rem;
          /* Diagnostics hug the top edge, confirms the bottom. Not `stretch`:
             the splitter is itself a flex line, so stretch would hand a third
             of the slack to a row that does not exist. */
          align-content: space-between;
          /* The bar's 0.7rem gap is a *column* gap here. Spending it between
             the rows as well would cost more than the slack there is. */
          row-gap: 0;
        }
        /* One order for the whole upper row, so markup order decides it. That
           is load-bearing for «Завершить»: it must land at the far end, at the
           opposite end of the strip from the mute, because mid-row it sits
           directly above the confirm buttons with 9 px between them — a press
           aimed at «Засчитать» and landing high would end the session, the
           exact hazard the one-row layout spends the whole strip's width
           avoiding. It is last in the markup, and this is why.

           It used to need an `order: 2` of its own, back when the readouts sat
           after it. They do not any more; the markup carries it now. */
        #adult-bar.stage-two > * { order: 1; }
        #adult-bar.stage-two #adult-bar-break {
          display: block;
          order: 3;
          flex-basis: 100%;
          height: 0;
        }
        /* The lower row, and nothing else on it. `flex: 1 1 0` is what keeps it
           there: a basis of 0 is never wide enough to force a line break, so
           four long labels overflow *inside* this box and scroll, instead of
           wrapping the whole group onto a third row that the fixed height would
           clip. The scrollbar is suppressed for the same reason as the bar's. */
        #adult-bar.stage-two #target-confirms {
          order: 4;
          flex: 1 1 0;
          min-width: 0;
          overflow-x: auto;
          /* Explicit, because a box with one axis `auto` and the other left at
             `visible` computes the second to `auto` too — which would be a
             vertical scrollbar inside a row sized to the pixel. */
          overflow-y: hidden;
          scrollbar-width: none;
        }
        #adult-bar.stage-two #target-confirms::-webkit-scrollbar { display: none; }
        /* Sized here rather than left to `align-self: stretch`, which would
           only fill a row that is as tall as its own tallest item — circular.
           3rem clears the ~48 dp both platforms advise. The confirms bleed
           downward into the bar's bottom padding so their row is flush with the
           screen edge; the mute bleeds upward, because on the upper row the
           downward half would run into the confirm buttons. */
        #adult-bar.stage-two #target-confirms {
          height: 3rem;
          margin-block: 0 -0.5rem;
        }
        #adult-bar.stage-two #hold-mute {
          height: 3rem;
          margin-block: -0.5rem 0;
        }
        /* Three lines here, where a row is 3rem, against the two a 3.25rem
           one-row strip can show. Same exact-multiple rule as the base — 3 ×
           16 px — and it is the narrow widths that need it, because that is
           where these are squeezed to ~100 px and were losing a third of every
           figure off the bottom. It costs no height: the mute already sets this
           row to 3rem. */
        #adult-bar.stage-two #debug-readout,
        #adult-bar.stage-two #match-readout {
          max-height: 3rem;
        }

          <!-- Runs for about a minute at session cadence, so warming up is
               visible. A three-second burst cannot see thermal throttling,
               which is the failure that would pass a benchmark and then ruin
               the second half of a session. -->
          <button id="probe-sustained" disabled></button>
        </div>
        <p class="status" id="probe-status" hidden></p>
        <p class="hint" id="probe-readout"></p>
      </fieldset>

      <!--
        What this device is, behind `?diag=1` and off by default. Same register
        and the same audience as the probe above: development instrumentation
        the team reads, kept off the screen the specialist works on.

        It exists because the two questions it answers both came from a phone,
        and on a phone the console they would otherwise print to needs a Mac and
        Web Inspector. See src/diagnostics.ts.
      -->
      <fieldset id="diagnostics-section" hidden>
        <legend id="diagnostics-legend"></legend>
        <p class="hint" id="diagnostics-hint"></p>
        <pre id="diagnostics-readout"></pre>
        <div class="row">
          <button id="diagnostics-copy"></button>
          <span class="status" id="diagnostics-copied"></span>
        </div>
      </fieldset>

      <!-- Stage-2 targets. Rows are built by src/main.ts so the label inputs
           and clip pickers stay in sync with the playlist. -->
      <fieldset id="targets-section" hidden>
        <legend id="targets-legend"></legend>
        <p class="hint" id="targets-hint"></p>
        <!--
          What came back from the last session, and the way out of it.

          ADR 0009 permits keeping the setup on the device and requires that a
          restored reference is never restored in silence: one tablet in a
          clinic sees several children, and matching one child's sound against
          another child's reference would play the wrong reward. So the line
          says what was restored and the button starts over.
        -->
        <p class="hint" id="calibration-restored" hidden>
          <span id="calibration-restored-text"></span>
          <button type="button" id="calibration-reset"></button>
        </p>
        <div id="target-rows"></div>
        <!--
          How an utterance is represented for matching. Present because which
          one suits phrase-length targets is an open question that only a real
          voice can settle (docs/onnx-russian-phrase-recognition.md), and the
          only way to compare them is to switch between them in the room.

          Not a product control. It is here to be measured with, and it should
          leave with the PoC unless the comparison says one mode should be
          chosen per target — which would be a decision with an ADR, not a
          toggle.
        -->
        <div class="row">
          <label for="match-mode" id="match-mode-label"></label>
          <select id="match-mode">
            <option value="pooled"></option>
            <option value="sequence"></option>
            <!-- A different tier, not a third representation: alignment against
                 the written target, with no confirmations to collect. Costs a
                 225 MB model, fetched only when this is selected. -->
            <option value="phrase"></option>
          </select>
        </div>
        <p class="hint" id="match-mode-hint"></p>
        <!--
          Where phrase recognition runs, for the Phase-0 server experiment.

          Present only on a build given a gateway URL, and only while phrase
          matching is selected. It is a *selector* rather than a button because
          the choice configures every attempt in the next session rather than
          performing one action (docs/poc-plan.md, "Specialist-facing flow").

          No visible text lives here: src/main.ts fills every label from
          strings.ts, as everywhere else on this page.
        -->
        <div id="phrase-location" hidden>
          <p class="hint" id="phrase-location-legend"></p>
          <div class="row">
            <label class="checkbox">
              <input type="radio" name="phrase-location" id="location-device" />
              <span id="location-device-label"></span>
            </label>
          </div>
          <p class="hint" id="location-device-hint"></p>
          <div class="row">
            <label class="checkbox">
              <input type="radio" name="phrase-location" id="location-server" />
              <span id="location-server-label"></span>
            </label>
          </div>
          <p class="hint" id="location-server-hint"></p>
          <p class="status" id="server-status" hidden></p>
          <!-- Recovery without support contact: warm-up can fail for reasons
               that are gone a second later, and the adult always has the device
               route as an explicit alternative. -->
          <button id="server-retry" hidden></button>
        </div>
        <!--
          How much closer the winner has to be than the next-best target before
          the app counts it itself. This is the gate aimed at two targets being
          mistaken for each other — the «би»/«ме» case in docs/detection.md,
          2026-08-08 — and raising it trades wrong rewards for questions to the
          adult rather than making the two sounds distinguishable.

          Moving it does NOT reset the collected examples: it is read when
          scoring, not when enrolling. Development control; leaves with the PoC.
        -->
        <div class="row">
          <label for="margin-ratio" id="margin-ratio-label"></label>
          <input type="range" id="margin-ratio" min="1" max="3" step="0.1" value="1.3" />
          <span id="margin-ratio-value"></span>
        </div>
        <p class="hint" id="margin-ratio-hint"></p>
        <div class="row">
          <label class="checkbox">
            <!--
              On by default at the specialist's request (2026-08-03), after
              testing the alternative. It was shipped off so both could be
              tried in the room; four black windows give the child nothing to
              learn the mapping from, and that turned out to matter more than
              the risk of a still frame rewarding silence. Still a toggle —
              this is the specialist's call to change back, not ours.
            -->
            <input type="checkbox" id="idle-frames" checked />
            <span id="idle-frames-label"></span>
          </label>
        </div>
        <p class="hint" id="idle-frames-hint"></p>
        <div class="row">
          <label class="checkbox">
            <!--
              Off by default: most children in scope cannot read, and the
              labels are the fastest way for the adult to tell four buttons
              apart. It is on for the children who can — see maskLabel in
              src/targets.ts for what it leaves behind and why two characters.
            -->
            <input type="checkbox" id="hide-labels" />
            <span id="hide-labels-label"></span>
          </label>
        </div>
        <p class="hint" id="hide-labels-hint"></p>
      </fieldset>

      <button class="primary" id="start-session" disabled></button>
    </main>

    <!-- Session: the play surface -->
    <div id="session" hidden>
      <div id="stage">
      <!-- `preload` so playback starts quickly on the first reward. The frame
           it decodes is deliberately NOT shown: see #curtain below.

           TWO elements, used as a double buffer. Switching clips on a single
           element means reassigning `src`, which tears down the media pipeline
           and rebuilds it — an audible silence at every clip boundary. The
           idle element decodes the next clip while this one plays, so a
           boundary is a swap. See src/session.ts. -->
      <video id="reward" playsinline preload="auto"></video>
      <video id="reward-b" class="behind" playsinline preload="auto"></video>
      <!--
        Black cover over the video whenever a reward is not playing.

        An earlier version left the paused frame on screen, on the reasoning
        that a waiting cartoon builds anticipation. The specialist corrected
        this (2026-07-26): for some children the still picture is *itself*
        reinforcing, so leaving it up delivers a reward the child did not have
        to make a sound for, and the contingency the protocol depends on comes
        apart. Between rewards the screen must give nothing back.

        A cover rather than hiding the video, so the decoder is never disturbed
        mid-playback.
      -->
      <div id="curtain"></div>
      </div>
      <!--
        Stage 2: four rewards at once, one per target sound. The child learns
        by trial which sound opens which window (domain.md), so a cell's
        position is fixed for the whole session.

        Each cell carries its own curtain for the same reason the stage-1 one
        exists — but whether idle cells show their first frame is a live
        clinical question (four black squares are indistinguishable, a frozen
        frame is itself reinforcing), so it is a setting rather than a
        decision. See src/stage2.ts.
      -->
      <div id="grid" hidden>
        <div class="cell">
          <video playsinline preload="auto"></video>
          <div class="cell-curtain"></div>
        </div>
        <div class="cell">
          <video playsinline preload="auto"></video>
          <div class="cell-curtain"></div>
        </div>
        <div class="cell">
          <video playsinline preload="auto"></video>
          <div class="cell-curtain"></div>
        </div>
        <div class="cell">
          <video playsinline preload="auto"></video>
          <div class="cell-curtain"></div>
        </div>
      </div>

      <div id="adult-bar">
        <!-- Hold to stop listening; release to resume. Deliberately at the
             opposite end of the bar from «Завершить», because this one gets
             grabbed fast and without looking, and a miss must not end the
             session.

             The confirm buttons sit next to it. Those two are the pair the
             adult actually works during a session, and a hand resting on
             «Засчитать» should not have to cross the bar to mute. The
             adjacency was bought by moving the readouts right rather than by
             moving the mute inward: the mute is fast because it is in the
             corner (see #hold-mute), and a control that needs aiming would
             lose exactly what this reordering is for. -->
        <button id="hold-mute"></button>
        <button class="primary" id="confirm"></button>
        <!-- One confirm button per target at stage 2, built by main.ts: the
             adult has to say *which* sound they are counting, and that press is
             also the enrolment signal. -->
        <span id="target-confirms"></span>
        <!-- Forces the row split at stage 2 below 1600 px, and is
             `display: none` everywhere else.
             Empty and unlabelled on purpose: it is layout, so it must not reach
             the accessibility tree. Flex has no break-before, which is the only
             reason it is an element at all. -->
        <span id="adult-bar-break" aria-hidden="true"></span>
        <!-- The second split, and only on a phone: it puts «Завершить» a whole
             row away from «Засчитать» instead of 6 px above it. Same reasons
             for being an element as its neighbour above, and `display: none`
             at every width but the one that needs it. -->
        <span id="adult-bar-break-phone" aria-hidden="true"></span>
        <!-- Sensitivity, reachable without ending the session — and the mute,
             because its far-left end is "do not listen". One continuous
             gesture rather than two taps, and the handle's position is the
             state, so there is nothing to forget. Detection is all that stops:
             the confirm buttons keep working, because an adult who has muted
             is usually counting responses by hand. -->
        <label id="session-sensitivity-label" for="session-sensitivity"></label>
        <input type="range" id="session-sensitivity" min="0" max="100" value="50" />
        <!-- The reward was not earned: stop it and take the count back. Next to
             the sensitivity control on purpose — a false positive is a
             sensitivity problem, and this is the pair the adult reaches for
             when the app is firing on coughs and doors.

             It is what the slider's right-hand overshoot now lands on. That
             used to be «Завершить», which ends the session; this ends a reward
             and can be answered with «Засчитать», so the worst outcome of a
             mis-aim went from losing the session to losing one trial.

             Disabled unless a reward is actually playing — see session.ts. A
             disabled button keeps its width, so this cannot move the bar. -->
        <button id="stop-reward" disabled></button>
        <span id="session-listening"></span>
        <span id="session-position"></span>
        <span id="debug-readout"></span>
        <!--
          Raw matching numbers, for comparing the two match modes on a real
          voice. Same register as the latency figures beside it: diagnostics
          for the team, not a judgement about the child.

          It shows the winning distance against the gate that distance is
          being measured for, because which of the gate's two terms is winning
          is what decides whether a near-miss is accepted, and no single
          distance reveals it. Leaves with the PoC.
        -->
        <span id="match-readout"></span>
        <!-- THE RIGHT-HAND CORNER: what the session *is*, and how it ends.
             Everything before this is worked during a session; these three are
             read during one and pressed once at the end of it, so they sit
             together at the far end rather than among the controls.

             They are carried there by the two readouts above, which are
             `flex: 1 1 0` and swallow the whole of the bar's slack — so this
             group starts wherever the slack runs out, which is the right edge.
             Nothing here sets a margin to achieve that; if those readouts ever
             stop growing, this group drifts back inward.

             «этап» is which stage is running. Cheap where there is room, and it
             removes a whole class of "the app is broken" that is really "the
             wrong mode started" — but it is the first thing dropped when there
             is not, at 900 px and below (see the media queries above).
             «Засчитано» is the specialist's count — see the flex rules above
             for why it is the one readout that never truncates, at any width.

             «Завершить» must stay LAST in this markup. At stage 2 below 1600 px
             the strip is two rows and every upper-row item shares one `order`,
             so markup order is what keeps it at the far end of the upper row
             instead of directly above a confirm button — a press aimed at
             «Засчитать» and landing high would otherwise end the session. -->
        <span id="session-stage"></span>
        <span id="session-count"></span>
        <button id="end-session"></button>
      </div>
    </div>

  </body>
</html>
